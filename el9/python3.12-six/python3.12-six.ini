[program]
changelog_user = EuroLinux Autopatch <devel@euro-linux.com>
package_config = False

[autodist]
enable_autodist = False

[re1]
match = PGDG%%{\?dist}
replace = %%{?dist}
changelog = Remove PGDG release

[re2]
match = %%{\?dist}
replace = SM%%{?dist}
changelog = Add SM release

[re3]
match = (?m)^%%p(g)dg_python3_setup$
replace = %%global    __python3 %%{_bindir}/python3.12
    %%global    python3_pkgversion 3.12
changelog = Use python3.12 instead of pgdg_python3_setup

[re4]
match = (BuildRequires:\s+python%%{python3_pkgversion}-wheel)
replace = \1
    BuildRequires:	python%%{python3_pkgversion}-packaging
changelog = Add python3.12-packaging BR, needed by pyproject_save_files.py from %%%%pyproject_install

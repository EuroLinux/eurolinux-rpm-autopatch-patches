[program]
changelog_user = EuroLinux Autopatch <devel@euro-linux.com>
package_config = False

[autodist]
enable_autodist = False

[re1]
match = PGDG%%{\?dist}
replace = %%{?dist}
changelog = Remove PGDG release

[re2]
match = %%{\?dist}
replace = SM%%{?dist}
changelog = Add SM release

[re3]
match = (%%g(l)obal sname psycopg2)
replace = \1
    
    %%global pgmajorversion 18
changelog = Add pgmajorversion global

[re4]
match = %%\{expand: %%%%g(l)obal pybasever [^\n]*
replace = %%global pybasever 3.12
changelog = Hardcode pybasever, python3.12 is not available in the SRPM build chroot

[re5]
match = %%\{expand: %%%%g(l)obal pgdg_python3_sitearch [^\n]*
replace = %%global pgdg_python3_sitearch %%{_libdir}/python3.12/site-packages
changelog = Hardcode pgdg_python3_sitearch, python3.12 is not available in the SRPM build chroot and distutils is removed in python3.12

[re6]
match = export PATH=%%{pginstdir}/bin:\$PATH
replace = export PATH=/usr/pgsql-%%{pgmajorversion}/bin:$PATH
changelog = Use pgmajorversion bin directory in PATH, pginstdir is not defined

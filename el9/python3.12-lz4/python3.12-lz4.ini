[program]
changelog_user = EuroLinux Autopatch <devel@euro-linux.com>
package_config = False

[autodist]
enable_autodist = False

[re1]
match = PGDG%%{\?dist}
replace = %%{?dist}
changelog = Remove PGDG release

[re2]
match = %%{\?dist}
replace = SM%%{?dist}
changelog = Add SM release

[re3]
match = (?m)^%%p(g)dg_python3_setup$
replace = %%global    __python3 %%{_bindir}/python3.12
    %%global    python3_pkgversion 3.12
changelog = Use python3.12 instead of pgdg_python3_setup

[re4]
match = %%d(e)fine pybasever [^\n]*
replace = %%global pybasever 3.12
changelog = Hardcode pybasever, python3.12 is not available in the SRPM build chroot

[re5]
match = %%d(e)fine python3_sitearch [^\n]*
replace = %%global python3_sitearch %%{_libdir}/python3.12/site-packages
changelog = Hardcode python3_sitearch, python3.12 is not available in the SRPM build chroot

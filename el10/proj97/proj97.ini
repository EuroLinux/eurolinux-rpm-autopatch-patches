[program]
changelog_user = EuroLinux Autopatch <devel@euro-linux.com>
package_config = False

[autodist]
enable_autodist = False

[re1]
match = %%pgdg_set_gis_variables
replace = %%global proj97majorversion              97
    %%global proj97instdir                   /usr/proj%%{proj97majorversion}
changelog = Replace pgdg_set_gis_variables with globals

[re2]
match = PGDG%%{\?dist}
replace = %%{?dist}
changelog = Remove PGDG release

[re3]
match = %%{\?dist}
replace = SM%%{?dist}
changelog = Add SM release

[re4]
match = (BuildRequires:.*pgdg-srpm-macros.*)
replace = \1
    BuildRequires:\tchrpath
changelog = Add chrpath to BuildRequires

[re5]
match = (%%{__install} %%{SOURCE2} %%{buildroot}%%{_sysconfdir}/ld.so.conf.d/)
replace = \1
    find %%{buildroot}%%{proj97instdir}/bin -type f -executable -exec chrpath -r '$ORIGIN/../lib64' {} + || true
    find %%{buildroot}%%{proj97instdir}/lib64 -name "*.so*" -exec chrpath -r '$ORIGIN/../lib64' {} + || true
changelog = Add find and chrpath
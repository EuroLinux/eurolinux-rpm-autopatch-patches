[program]
changelog_user = EuroLinux Autopatch <devel@euro-linux.com>
package_config = False

[autodist]
enable_autodist = False

[re1]
match = %%pgdg_set_gis_variables
replace = %%global geos313majorversion             313
    %%global geos313instdir                  /usr/geos%%{geos313majorversion}
    %%global geos313fullversion              3.13.1
changelog = Replace pgdg_set_gis_variables wih globals

[re2]
match = PGDG%%{\?dist}
replace = %%{?dist}
changelog = Remove PGDG release

[re3]
match = %%{\?dist}
replace = SM%%{?dist}
changelog = Add SM release
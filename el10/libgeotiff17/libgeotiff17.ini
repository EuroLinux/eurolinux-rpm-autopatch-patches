[program]
changelog_user = EuroLinux Autopatch <devel@euro-linux.com>
package_config = False

[autodist]
enable_autodist = False

[re1]
match = %%pgdg_set_gis_variables
replace = %%global libgeotiff17majorversion        17
    %%global proj97majorversion              97
    %%global proj96majorversion              96
    %%global libgeotiff17instdir             /usr/libgeotiff%%{libgeotiff17majorversion}
    %%global proj97instdir                   /usr/proj%%{proj97majorversion}
    %%global proj96instdir                   /usr/proj%%{proj96majorversion}
    %%global proj97fullversion               9.7.0
    %%global proj96fullversion               9.6.2
changelog = Replace pgdg_set_gis_variables with globals

[re2]
match = PGDG%%{\?dist}
replace = %%{?dist}
changelog = Remove PGDG release

[re3]
match = %%{\?dist}
replace = SM%%{?dist}
changelog = Add SM release

[re4]
match = (BuildRequires:.*pgdg-srpm-macros.*)
replace = \1
    BuildRequires:\tg++
changelog = Add g++ to BuildRequires

[re5]
match = cmake .. -DCMAKE_C_COMPILER_LAUNCHER=ccache \\
replace = cmake .. -DPROJ_LIBRARY=%%{projinstdir}/lib64/libproj.so \\
    \t-DPROJ_INCLUDE_DIR=%%{projinstdir}/include \\
changelog = Update cmake parameters for PROJ
[program]
changelog_user = EuroLinux Autopatch <devel@euro-linux.com>
package_config = False

[autodist]
enable_autodist = False

[re1]
match = PGDG%%{\?dist}
replace = %%{?dist}
changelog = Remove PGDG release

[re2]
match = %%{\?dist}
replace = SM%%{?dist}
changelog = Add SM release

[re3]
match = (BuildRequires:.*pgdg-srpm-macros.*)
replace = \1
    BuildRequires:\tchrpath
changelog = Add chrpath to BuildRequires

[re4]
match = (DESTDIR=%%{buildroot})
replace = \1
    chrpath --delete %%{buildroot}/usr/lib64/libSFCGAL.so.* || true
changelog = Add chrpath delete for libSFCGAL
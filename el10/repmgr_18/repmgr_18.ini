[program]
changelog_user = EuroLinux Autopatch <devel@euro-linux.com>
package_config = False

[autodist]
enable_autodist = False

[re1]
match = PGDG%%{\?dist}
replace = %%{?dist}
changelog = Remove PGDG release

[re2]
match = %%{\?dist}
replace = SM%%{?dist}
changelog = Add SM release

[re3]
match = pgpackageversion
replace = pgmajorversion
changelog = Change pgpackageversion to pgmajorversion

[re4]
match = (make.*install.*)
replace = \1
    export QA_RPATHS=0x0002
changelog = ignore RPATH (0x0002) for repmgr_18

[program]
changelog_user = EuroLinux Autopatch <devel@euro-linux.com>
package_config = False

[autodist]
enable_autodist = False

[re1]
match = PGDG%%{\?dist}
replace = %%{?dist}
changelog = Remove PGDG release

[re2]
match = %%{\?dist}
replace = SM%%{?dist}
changelog = Add SM release

[re3]
match = pgpackageversion
replace = pgmajorversion
changelog = Change pgpackageversion to pgmajorversion

[re4]
match = (BuildRequires:\s+postgresql%%{pgmajorversion}-devel.*)
replace = \1
    BuildRequires:	chrpath
changelog = Add chrpath to BuildRequires

[re5]
match = (make.*install.*)
replace = \1
    chrpath --delete %%{buildroot}%%{pginstdir}/bin/repmgr || true
    chrpath --delete %%{buildroot}%%{pginstdir}/bin/repmgrd || true
    chrpath --delete %%{buildroot}%%{pginstdir}/lib/repmgr.so* || true
changelog = Add chrpath delete for repmgr_18

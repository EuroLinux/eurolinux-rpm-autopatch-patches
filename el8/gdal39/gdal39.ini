[program]
changelog_user = EuroLinux Autopatch <devel@euro-linux.com>
package_config = False

[autodist]
enable_autodist = False

[re1]
match = %%pgdg_set_gis_variables
replace = %%global geos313majorversion            313
    %%global libgeotiffmajorversion          17
    %%global ogdimajorversion                41
    %%global proj95majorversion              95
    %%global geos313instdir                  /usr/geos%%{geos313majorversion}
    %%global libgeotiffinstdir               /usr/libgeotiff%%{libgeotiffmajorversion}
    %%global libspatialiteinstdir            /usr/libspatialite%%{libspatialitemajorversion}
    %%global ogdiinstdir                     /usr/ogdi%%{ogdimajorversion}
    %%global proj95instdir                   /usr/proj%%{proj95majorversion}
    %%global geos313fullversion              3.13.1
    %%global proj95fullversion               9.5.0
changelog = Replace pgdg_set_gis_variables with globals

[re2]
match = PGDG%%{\?dist}
replace = %%{?dist}
changelog = Remove PGDG release

[re3]
match = %%{\?dist}
replace = SM%%{?dist}
changelog = Add SM release

[re4]
match = %%global pyver 3.9
replace = %%global pyver 3.6
changelog = Modify Python version
[program]
changelog_user = EuroLinux Autopatch <devel@euro-linux.com>
package_config = False

[autodist]
enable_autodist = False

[re1]
match = PGDG%%{\?dist}
replace = %%{?dist}
changelog = Remove PGDG release

[re2]
match = %%{\?dist}
replace = SM%%{?dist}
changelog = Add SM release

[re3]
match = %%{(e)xpand: %%%%global pgdg_python3_sitearch %%\(echo `%%{__ospython} -c "from distutils.sysconfig import get_python_lib; print\(get_python_lib\(2\)\)"`\)}
replace = %%global pgdg_python3_sitearch /usr/lib64/python%%{python3_pkgversion}/site-packages
    %%global pgmajorversion 14
changelog = set python sitesearch and add pgmajorversion global

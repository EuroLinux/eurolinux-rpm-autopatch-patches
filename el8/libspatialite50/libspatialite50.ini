[program]
changelog_user = EuroLinux Autopatch <devel@euro-linux.com>
package_config = False

[autodist]
enable_autodist = False

[re1]
match = %%pgdg_set_gis_variables
replace = %%global geos314majorversion             314
    %%global proj96majorversion              96
    %%global geos314instdir                  /usr/geos%%{geos314majorversion}
    %%global proj96instdir                   /usr/proj%%{proj96majorversion}
    %%global geos314fullversion              3.14.1
    %%global proj96fullversion               9.6.2
changelog = Replace pgdg_set_gis_variables wih globals

[re2]
match = PGDG%%{\?dist}
replace = %%{?dist}
changelog = Remove PGDG release

[re3]
match = %%{\?dist}
replace = SM%%{?dist}
changelog = Add SM release
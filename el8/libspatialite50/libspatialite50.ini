[program]
changelog_user = EuroLinux Autopatch <devel@euro-linux.com>
package_config = False

[autodist]
enable_autodist = False

[re1]
match = %%pgdg_set_gis_variables
replace = %%global geos312majorversion             312
    %%global proj94majorversion		         94
    %%global geos312instdir                  /usr/geos%%{geos312majorversion}
    %%global proj94instdir                   /usr/proj%%{proj94majorversion}
    %%global geos312fullversion              3.12.2
    %%global proj94fullversion		         9.4.1
changelog = Replace pgdg_set_gis_variables wih globals

[re2]
match = PGDG%%{\?dist}
replace = %%{?dist}
changelog = Remove PGDG release

[re3]
match = %%{\?dist}
replace = SM%%{?dist}
changelog = Add SM release
[program]
changelog_user = EuroLinux Autopatch <devel@euro-linux.com>
package_config = False

[autodist]
enable_autodist = False

[re1]
match = PGDG%%{\?dist}
replace = %%{?dist}
changelog = Remove PGDG release

[re2]
match = %%{\?dist}
replace = SM%%{?dist}
changelog = Add SM release

[re3]
match = (BuildRequires:	python%%{python3_pkgversion}-devel)
replace = \1 python%%{python3_pkgversion}-setuptools python%%{python3_pkgversion}-pip
changelog = Add setuptools and pip modules

[re4]
match = (Name)
replace = %%global __python3 /usr/bin/python%%{python3_pkgversion}
    %%global python3_version %%{python3_pkgversion}
    %%global python3_sitearch /usr/lib64/python%%{python3_pkgversion}/site-packages
    %%global python3_sitelib /usr/lib/python%%{python3_pkgversion}/site-packages
    
    \1
changelog = Set python%%{python3_pkgversion} globals
